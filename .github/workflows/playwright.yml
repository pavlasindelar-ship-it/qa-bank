name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      parabank:
        image: parasoft/parabank
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl --fail http://127.0.0.1:8080/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Wait for Parabank service
      run: |
        echo "Čekám na Parabank service na http://127.0.0.1:8080/"
        for i in {1..24}; do
          if curl --fail --silent http://127.0.0.1:8080/ >/dev/null 2>&1; then
            echo "Parabank je online"
            exit 0
          fi
          echo "Čekám 5 sekund... ($i/24)"
          sleep 5
        done
        echo "Chyba: Parabank nebyl dostupný do 120 sekund"
        exit 1
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
